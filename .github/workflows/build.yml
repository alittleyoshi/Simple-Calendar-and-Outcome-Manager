name: Building

on:
  push:
    branches:
    - android
  workflow_dispatch:
  workflow_call:

jobs:
  build-for-android:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache
      uses: actions/cache@v4.2.0
      env:
        cache-name: cache-flutter-android
      with:
        path: |
          ./flutter_scom/build/
          ./flutter_scom/.dart_tool/
          ~/.pub-cache/
          ~/.gradle/
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('./flutter_scom/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-

    # - name: pre-build
      # run: sudo apt-get update -y && sudo apt-get upgrade -y && sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa && sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev;
    - uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: curl git unzip xz-utils zip libglu1-mesa clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
        version: 1.0
    - name: cmake-install
      run: |
        curl -OLJs https://github.com/Kitware/CMake/releases/download/v3.31.7/cmake-3.31.7-linux-x86_64.tar.gz
        tar -xf ./cmake-3.31.7-linux-x86_64.tar.gz -C .
    - name: flutter-install
      run: curl -O https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.27.0-stable.tar.xz && tar -xf ./flutter_linux_3.27.0-stable.tar.xz -C .
    - name: build
      run: export PATH=/home/runner/work/Simple-Calendar-and-Outcome-Manager/Simple-Calendar-and-Outcome-Manager/cmake-3.31.7-linux-x86_64/bin:$PATH && cd flutter_scom && ../flutter/bin/flutter config --no-analytics && ../flutter/bin/flutter config --no-cli-animations && ../flutter/bin/flutter pub get && ../flutter/bin/flutter build apk --verbose
    - name: bundle
      run: tar -zcvf ./android-release.tar.gz ./flutter_scom/build/android/

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.4.3
      with:
        name: android-release
        path: android-release.tar.gz